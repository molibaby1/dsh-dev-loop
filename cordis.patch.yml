# Optional DSH profile overlay. It mounts only the Controller host adapter;
# the active dsh-codex-subscription provider remains the model authority.
- insert:
    - id: dev-loop-controller
      name: 'dsh-dev-loop/live-plugin'
      config:
        modulePath: 'dsh-dev-loop'
        provider: 'openai-codex'
        model: 'gpt-6-luna'
        permissionPreset: 'workspace-write'
        autoApprove: false
        projectRoot: !!js process.env.DSH_DEV_LOOP_PROJECT_ROOT
        artifactRoot: !!js process.env.DSH_DEV_LOOP_ARTIFACT_ROOT
        bridgeBaseUrl: !!js process.env.DSH_BRIDGE_URL || 'http://127.0.0.1:7688'
        bridgeToken: !!js process.env.DSH_BRIDGE_TOKEN || ''
        bridgeTokenFile: !!js process.env.DSH_BRIDGE_TOKEN_FILE
    - id: dev-loop-ui
      name: 'dsh-dev-loop-ui'
      config: {}
